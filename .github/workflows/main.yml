name: Crea APK EulerScope

on:
  workflow_dispatch:
  push:
    branches:
      - principale

jobs:
  build:
    name: Compila APK
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Controlla Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME"
          "$ANDROID_HOME/platform-tools/adb" version || true

      - name: Installa eventuali componenti mancanti
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;25.2.9519653"

      - name: Rendi eseguibile Gradle
        run: chmod +x gradlew

      - name: Compila APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: EulerScope-APK
          path: app/build/outputs/apk/debug/*.apk
